<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>{% block title %}IOD Inventory{% endblock %}</title>

    <style>
        /* ========= GENERAL PAGE ========= */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        h1 {
            margin-bottom: 5px;
        }

        h2 {
            margin-top: 32px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 6px;
        }

        hr {
            margin: 30px 0;
            border: none;
            border-top: 1px solid #ddd;
        }

/* ========= IBM‑INSPIRED TITLE (EDGE‑SAFE) ========= */
.ibm-inspired {
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #0062ff;        /* Solid IBM Blue fallback */
    display: inline-block;
}

/* Apply stripe mask ONLY when safe */
@supports (-webkit-background-clip: text) {
    .ibm-inspired {
        background-image: repeating-linear-gradient(
            to bottom,
            rgba(0, 98, 255, 0.85) 0px,
            rgba(0, 98, 255, 0.85) 3px,
            transparent 3px,
            transparent 6px
        );

        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;            /* Use color, NOT text-fill */
    }
}

        /* ========= FORMS ========= */
        form {
            background: #ffffff;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            margin-bottom: 10px;
        }

        select,
        input[type="number"],
        input[type="text"] {
            padding: 6px 8px;
            margin-right: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* ========= BUTTONS ========= */
        button {
            padding: 6px 14px;
            background-color: #1976d2;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #125ea8;
        }

        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        /* ========= TABLES ========= */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            margin-top: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px 10px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f0f2f5;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        /* ========= FOOTER ========= */
        footer {
            margin-top: 50px;
            font-size: 13px;
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>

    {% block content %}{% endblock %}

    <footer>
        IOD Inventory v1.0
    </footer>

</body>
</html>
